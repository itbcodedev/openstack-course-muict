site_name: วิชา OpenStack Cloud Computing | MUICT
site_description: เอกสารประกอบการสอน OpenStack Cloud Computing - คณะเทคโนโลยีสารสนเทศและการสื่อสาร มหาวิทยาลัยมหิดล
site_url: https://itbcodedev.github.io/openstack-course-muict/
repo_url: https://github.com/itbcodedev/openstack-course-muict
repo_name: GitHub

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: สลับเป็นโหมดมืด
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: สลับเป็นโหมดสว่าง
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  language: en

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/itbcodedev
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - หน้าแรก: index.md
  - หลักสูตร: syllabus.md
  - การบรรยาย:
    - lectures/lecture01-introduction.md
    - lectures/lecture02-architecture.md
    - lectures/lecture03-keystone.md
    - lectures/lecture04-nova.md
    - lectures/lecture05-neutron.md
    - lectures/lecture06-glance.md
  - การทดลอง:
    - labs/lab00-centos-hyperv.md
    - labs/lab01-devstack.md
    - labs/lab02-horizon.md
    - labs/lab03-cli.md
  - แหล่งข้อมูล: resources.md
